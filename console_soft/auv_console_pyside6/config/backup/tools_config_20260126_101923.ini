# AUV Console Tools Configuration
# Centralized configuration for all AUV analysis tools

[files]
# Text log file from PC104 (AUV's onboard computer)
# Contains $CKTH (Console→AUV) and $AUV (AUV→Console) packets
text_log_file = 20020101105852.txt

# PCAP network capture file (Wireshark/tcpdump format)
# Contains raw UDP packets captured from network
pcap_file = capture.pcapng

[paths]
# Base directory for data files (relative to script location)
# Leave empty to use current working directory
data_dir =

[analysis]
# Default packet viewer settings
viewer_auto_decode = true
viewer_show_raw_bytes = true

# Text replay sender settings
replay_interval_ms = 600
replay_loop = true
replay_auto_start = false

[display]
# Number format options
show_hex_values = true
show_binary_protocol = true
# Decimal places for GPS coordinates
gps_precision = 6

[network]
# Local simulation settings (for testing without real AUV)
local_mode = true
local_ip = 127.0.0.1
console_port = 21
auv_port = 52364

# Real network settings (for actual AUV communication)
# real_auv_ip = 192.168.0.101
# real_console_ip = 192.168.0.11
