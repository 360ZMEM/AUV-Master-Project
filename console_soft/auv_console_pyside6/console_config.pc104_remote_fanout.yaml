# AUV 上位机 PC104 远端 fan-out 配置文件
#
# 拓扑:
#   PC104                  192.168.0.101:21
#   运行本仓库平台/fan-out   192.168.0.11:21, 52364/udp, 7447/tcp
#   上位机 PC               192.168.0.12:52366
#
# 适用场景:
#   PySide6 上位机运行在独立 PC，上位机不直接绑定 PC104 21/udp，
#   而是经 192.168.0.11 上的 fan-out 收发 UDP，并经 Zenoh router
#   获得完整自主/仲裁/任务语义功能。

zenoh:
  router_ip: "192.168.0.11"
  router_port: 7447
  mode: "client"
  enabled: true
  pc_cmd_raw_key: "rt/pc/cmd_raw"
  telemetry_key: "rt/auv/telemetry"
  viz_internal_key: "rt/auv/viz/internal"
  publish_cmd_raw: true
  subscribe_bridge_telemetry: true
  subscribe_viz_internal: false

udp:
  local_ip: "192.168.0.12"
  local_port: 52366
  amd_ip: "192.168.0.11"
  amd_port: 52364

packet:
  obj_address: 1
  work_mode: 1
  depth_proprotect_param1: 500
  depth_proprotect_param2: 29
  bottom_proprotect_param1: 300
  bottom_proprotect_param2: 200
  preset_time: 10

communication:
  heartbeat_hz: 5.0
  pc_timeout_s: 1.5
  soft_warning_s: 1.0

defaults:
  work_mode: 1
  target_depth_m: 5.0
  track_distance_m: 500.0
  task_timeout_s: 1200
  mission_type: "CABLE_TRACKING"
