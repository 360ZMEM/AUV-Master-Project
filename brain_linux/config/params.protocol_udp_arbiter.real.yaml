# Real-AUV commissioning parameters for arbiter-enabled protocol_udp stack.
# This is the only brain params file that real-deployment shell scripts should
# use with --target real. Tune here first; do not tune the mock/sim profile.

bridge:
  backend: protocol_udp
  passive_mode: false
  command_publish_hz: 10.0
  protocol_control_mode_byte: 238
  protocol_work_instruction: 0
  protocol_send_zero_on_idle: true
  main_motor_rpm_scale: 15.0
  downlink_cmd_key: rt/auv/control/cmd_vel
  shadow_cmd_topic: /auv/bridge/shadow_cmd
  shadow_telemetry_topic: /auv/bridge/shadow_telemetry
  imu_key: rt/auv/sensors/imu
  dvl_key: rt/auv/sensors/dvl
  depth_key: rt/auv/sensors/depth
  magnetic_key: rt/auv/sensors/magnetic
  arbiter:
    enabled: true
    arbiter_status_topic: /auv/arbiter/status
    sensor_status_topic: /auv/sensors/status
    mpc_topic: /auv/control/mpc_cmd
    pc_cmd_raw_key: rt/pc/cmd_raw
    telemetry_key: rt/auv/telemetry
    viz_internal_key: rt/auv/viz/internal
    mpc_timeout_s: 0.5
    guard_min_total_voltage_v: 47.0
    guard_min_confidence: 0.5
    guard_max_uplink_age_ms: 200.0
  protocol_udp:
    local_host: 0.0.0.0
    local_port: 52365
    remote_host: 192.168.0.101
    remote_port: 21
    socket_timeout_s: 0.1
    recv_buffer_size: 2048
    obj_address: 1
    main_motor_rpm_scale: 15.0
    side_motor_rpm: 0
    zenoh_side_channel_enabled: true

controller:
  control_rate_hz: 20.0
  bypass_ekf: false
  filtered_state_topic: /auv/state/filtered
  raw_state_topic: /auv/state/raw_dr

limits:
  fin_deg_max: 30.0
  thrust_min: -60.0
  thrust_max: 60.0

control:
  target_u: 0.6
  u0: 0.5
  u_min: 0.3
  feedforward_trim_deg: -1.5
  attitude_guard:
    enable: true
    roll_deg_max: 120.0
    pitch_deg_max: 45.0
    recovery_target_pitch_deg: 0.0
    recovery_thrust: 20.0
  depth:
    kp: 0.15
    ki: 0.005
    kd: 0.0
    integral_limit: 2.0
    target_pitch_deg_max: 10.0
    target_pitch_rate_limit_deg_s: 6.0
  pitch:
    kp: 3.25
    ki: 0.075
    kd: 1.1
    integral_limit: 25.0
  yaw:
    kp: 4.5
    ki: 0.06
    kd: 0.7
    integral_limit: 25.0
  speed:
    kp: 14.0
    ki: 0.7
    kd: 1.5
    integral_limit: 30.0
    feedforward:
      a: 2.497183
      b: 27.729751
      c: 0.546851

ekf:
  gravity: 9.81
  sigma_acc: 0.08
  sigma_gyro: 0.01
  sigma_ba: 0.001
  sigma_bg: 0.0005
  sigma_dvl: 0.03
  sigma_depth: 0.10
  sigma_gps_xy: 0.5
  imu_acc_is_linear: true
  init_pos: [0.0, 0.0, 0.0]
  init_vel: [0.0, 0.0, 0.0]
  init_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  init_ba: [0.0, 0.0, 0.0]
  init_bg: [0.0, 0.0, 0.0]
  init_P_diag: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.2, 0.2, 0.2, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]

localization:
  publish_raw_state: true
  raw_state_topic: /auv/state/raw_dr
