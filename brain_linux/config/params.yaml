# Unified parameters for bridge/localization/controller/decision.

bridge:
  backend: zenoh_json
  passive_mode: false
  command_publish_hz: 10.0
  protocol_control_mode_byte: 238
  protocol_work_instruction: 0
  protocol_send_zero_on_idle: true
  main_motor_rpm_scale: 15.0
  downlink_cmd_key: rt/auv/control/cmd_vel
  shadow_cmd_topic: /auv/bridge/shadow_cmd
  shadow_telemetry_topic: /auv/bridge/shadow_telemetry
  imu_key: rt/auv/sensors/imu
  dvl_key: rt/auv/sensors/dvl
  depth_key: rt/auv/sensors/depth
  magnetic_key: rt/auv/sensors/magnetic
  arbiter:
    enabled: false
    arbiter_status_topic: /auv/arbiter/status
    sensor_status_topic: /auv/sensors/status
    mpc_topic: /auv/control/mpc_cmd
    pc_cmd_raw_key: rt/pc/cmd_raw
    telemetry_key: rt/auv/telemetry
    viz_internal_key: rt/auv/viz/internal
    mpc_timeout_s: 0.5
    guard_min_total_voltage_v: 47.0
    guard_min_confidence: 0.5
    guard_max_uplink_age_ms: 200.0
  protocol_udp:
    local_host: 0.0.0.0
    local_port: 52365
    remote_host: 127.0.0.1
    remote_port: 52364
    socket_timeout_s: 0.1
    recv_buffer_size: 2048
    obj_address: 1
    main_motor_rpm_scale: 15.0
    side_motor_rpm: 0
    zenoh_side_channel_enabled: false

controller:
  control_rate_hz: 20.0
  bypass_ekf: false
  filtered_state_topic: /auv/state/filtered
  raw_state_topic: /auv/state/raw_dr
  use_mpc: false
  control_mode_byte: 239
  heading_ramp_limit_deg: 30.0
  heading_ramp_rate_deg_s: 10.0

mappers:
  rudder:
    center_bias: 0.0
    gain: 1.0
    flip: false
  thrust:
    deadzone_percent: 5.0
    rpm_per_percent: 15.0
    voltage_nominal: 24.0
    voltage_compensation: true

limits:
  fin_deg_max: 30.0
  thrust_min: -100.0
  thrust_max: 100.0

control:
  target_u: 1.1
  u0: 1.0
  u_min: 0.6
  feedforward_trim_deg: -1.5
  attitude_guard:
    enable: true
    roll_deg_max: 120.0
    pitch_deg_max: 45.0
    recovery_target_pitch_deg: 0.0
    recovery_thrust: 20.0
  depth:
    kp: 0.30
    ki: 0.01
    kd: 0.0
    integral_limit: 4.0
    target_pitch_deg_max: 15.0
    target_pitch_rate_limit_deg_s: 8.0
  pitch:
    kp: 6.5
    ki: 0.15
    kd: 2.2
    integral_limit: 45.0
  yaw:
    kp: 9.0
    ki: 0.12
    kd: 1.4
    integral_limit: 45.0
  speed:
    kp: 28.0
    ki: 1.4
    kd: 3.0
    integral_limit: 55.0
    feedforward:
      a: 2.497183
      b: 27.729751
      c: 0.546851

ekf:
  gravity: 9.81
  sigma_acc: 0.08
  sigma_gyro: 0.01
  sigma_ba: 0.001
  sigma_bg: 0.0005
  sigma_dvl: 0.03
  sigma_depth: 0.05
  sigma_gps_xy: 0.5
  imu_acc_is_linear: true
  init_pos: [0.0, 0.0, 0.0]
  init_vel: [0.0, 0.0, 0.0]
  init_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  init_ba: [0.0, 0.0, 0.0]
  init_bg: [0.0, 0.0, 0.0]
  init_P_diag: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.2, 0.2, 0.2, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]

localization:
  publish_raw_state: false
  raw_state_topic: /auv/state/raw_dr
