# Unified parameters for arbiter-enabled protocol_udp stack.

bridge:
  backend: protocol_udp
  passive_mode: false
  command_publish_hz: 10.0
  protocol_control_mode_byte: 238
  protocol_work_instruction: 0
  protocol_send_zero_on_idle: true
  main_motor_rpm_scale: 15.0
  downlink_cmd_key: rt/auv/control/cmd_vel
  shadow_cmd_topic: /auv/bridge/shadow_cmd
  shadow_telemetry_topic: /auv/bridge/shadow_telemetry
  imu_key: rt/auv/sensors/imu
  dvl_key: rt/auv/sensors/dvl
  depth_key: rt/auv/sensors/depth
  magnetic_key: rt/auv/sensors/magnetic
  magnetic_block_key: rt/auv/sensors/magnetic_block
  cable_sonar_observation_key: rt/auv/sensors/cable_sonar_observation
  magnetic_extrinsics_status:
    enabled: true
    topic: /auv/sensors/magnetic_extrinsics_status
    publish_period_s: 1.0
    include_sim_position_hash: true
  arbiter:
    enabled: true
    arbiter_status_topic: /auv/arbiter/status
    sensor_status_topic: /auv/sensors/status
    mpc_topic: /auv/control/mpc_cmd
    pc_cmd_raw_key: rt/pc/cmd_raw
    telemetry_key: rt/auv/telemetry
    viz_internal_key: rt/auv/viz/internal
    mpc_timeout_s: 0.5
    guard_min_total_voltage_v: 47.0
    guard_min_confidence: 0.5
    guard_max_uplink_age_ms: 200.0
  protocol_udp:
    local_host: 0.0.0.0
    local_port: 52365
    remote_host: 127.0.0.1
    remote_port: 52364
    socket_timeout_s: 0.1
    recv_buffer_size: 2048
    obj_address: 1
    main_motor_rpm_scale: 15.0
    side_motor_rpm: 0
    zenoh_side_channel_enabled: true

sensor_extrinsics_estimated:
  mag:
    translation_b_m: [0.30001230153357483, 0.002987455375084699, -0.05274137855362218]
    rotation_rpy_deg: [-0.04452959193786371, -0.02273353925858613, 1.950417672250177]

metadata:
  mag_extrinsics_source: results/mag_extrinsics/fullflow_20260705_2145/estimated_extrinsics.yaml

controller:
  control_rate_hz: 20.0
  bypass_ekf: false
  filtered_state_topic: /auv/state/filtered
  raw_state_topic: /auv/state/raw_dr

limits:
  fin_deg_max: 30.0
  thrust_min: -100.0
  thrust_max: 100.0

control:
  terrain_cbf:
    lookahead_time_s: 4.0
    lpf_alpha: 0.2
    min_clearance_m: 1.8
    alpha: 0.7
    max_descend_rate_mps: 0.4
    emergency_clearance_m: 2.0
    emergency_rise_m: 2.0
    slowdown_clearance_margin_m: 1.5
    minimum_control_speed_scale: 0.8
    min_depth_m: 0.5
  target_u: 1.1
  u0: 1.0
  u_min: 0.6
  feedforward_trim_deg: -1.5
  attitude_guard:
    enable: true
    roll_deg_max: 120.0
    pitch_deg_max: 45.0
    recovery_target_pitch_deg: 0.0
    recovery_thrust: 20.0
  depth:
    kp: 0.30
    ki: 0.01
    kd: 0.0
    integral_limit: 4.0
    target_pitch_deg_max: 15.0
    target_pitch_rate_limit_deg_s: 8.0
  pitch:
    kp: 6.5
    ki: 0.15
    kd: 2.2
    integral_limit: 45.0
  yaw:
    kp: 9.0
    ki: 0.12
    kd: 1.4
    integral_limit: 45.0
  speed:
    kp: 28.0
    ki: 1.4
    kd: 3.0
    integral_limit: 55.0
    feedforward:
      a: 2.497183
      b: 27.729751
      c: 0.546851

mpc:
  prediction_horizon: 20
  dt: 0.2
  solver: 'ipopt'
  warm_start: true
  max_solve_time_ms: 50.0
  fail_safe_fallback: true
  ki_z: 0.1
  z_integral_clamp_m: 2.0

mpc_model:
  mass_u: 50.0
  mass_w: 50.0
  drag_u: 12.0
  drag_w: 20.0
  buoyancy_term: -0.5
  yaw_rate_gain: 8.0
  pitch_depth_gain: 0.8
  depth_to_heave_gain: 12.0
  max_pitch_deg: 20.0

mpc_weights:
  tracking:
    x: 1.0
    y: 1.0
    z: 40.0
    psi: 80.0
    u: 0.5
    w: 3.0
  control:
    psi_cmd: 0.005
    z_cmd: 0.002
    T_cmd: 0.01
  confidence_threshold: 0.6
  low_confidence_scale: 3.0
  low_confidence_control_scale: 0.3

mpc_constraints:
  min_speed_ms: 0.3
  max_pitch_deg: 20.0
  min_altitude_m: 1.5
  max_thrust_percent: 100.0
  min_thrust_percent: 15.0
  delta_z_max_per_step: 0.3
  delta_psi_max_per_step: 0.0419
  z_band_m: 4.0
  psi_band_rad: 0.7854
  enable_rate_constraints: true
  enable_band_constraints: true
  enable_constraint_slack: false

ekf:
  gravity: 9.81
  sigma_acc: 0.08
  sigma_gyro: 0.01
  sigma_ba: 0.001
  sigma_bg: 0.0005
  sigma_dvl: 0.03
  sigma_depth: 0.05
  sigma_gps_xy: 0.5
  imu_acc_is_linear: true
  init_pos: [0.0, 0.0, 0.0]
  init_vel: [0.0, 0.0, 0.0]
  init_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  init_ba: [0.0, 0.0, 0.0]
  init_bg: [0.0, 0.0, 0.0]
  init_P_diag: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.2, 0.2, 0.2, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]

localization:
  publish_raw_state: true
  raw_state_topic: /auv/state/raw_dr
  use_imu_orientation_measurement: true
