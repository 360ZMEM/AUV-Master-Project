/**:
  ros__parameters:
    magnetic_block_topic: /auv/sensors/magnetic_block
    sonar_observation_topic: /auv/sensors/cable_sonar_observation
    target_frequency_hz: 45.0
    minimum_target_cycles: 8.0
    maximum_age_s: 0.5
    cross_track_tolerance_m: 2.0

    calibration_domain: simulation_proxy
    magnetic_calibration_file: perception_quality_sim_magnetic.json
    sonar_calibration_file: perception_quality_sim_sonar.json

    # Magnetic p_track remains unavailable until a non-truth geometry context
    # (map heading plus altitude/separation estimate) is connected.
    magnetic_geometry_context_enabled: false
    cable_heading_rad: 0.0
    vertical_separation_m: 0.0
