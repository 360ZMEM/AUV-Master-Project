cable_tracking:
  enabled: true
  mission_types:
    - CABLE_TRACKING
    - CABLE_INSPECTION
  auv_master_mag_root: AUV-Master-Mag
  scenario_name: combined_cable_extreme_proxy

  prior:
    format: yaml
    path: ""
    frame: local_ned
    yaml_points_ned:
      - [0.0, 0.0, -11.5]
      - [10.0, 6.0, -12.0]
      - [20.0, 8.0, -13.0]
      - [26.0, 0.0, -13.8]
      - [20.0, -8.0, -14.0]
      - [8.0, -8.0, -13.2]
    burial_depth_m: null
    pose_error:
      enabled: false

  control:
    publish_setpoint: true
    default_depth_m: 4.0
    default_speed_mps: 0.4
    min_speed_mps: 0.2
    max_speed_mps: 0.8
    setpoint_timeout_s: 0.5
    bridge_backend: protocol_udp
    control_mode_byte: 238
    sine_period_s: 0.0
    high_priority: true

  recovery_guidance:
    enabled: false

  zigzag_limits:
    auto_limit: true
    max_heading_delta_deg: 35.0
    max_yaw_rate_deg_s: 12.0
    min_turn_radius_m: 4.0
    max_lateral_speed_mps: 0.45

  zigzag_probe:
    enabled: false
    lateral_amplitude_m: 0.0
    wavelength_m: 24.0
    phase_offset_deg: 0.0
    max_probe_heading_deg: 0.0

  magnetic:
    sample_rate_hz: 50.0
    block_size: 8
    sensor_frame: mag_link

  sensor_policy:
    runtime_status_topic: /auv/sensors/runtime_status
    required_capability: cable_inspection
    navigation_timeout_s: 0.5
    magnetic_timeout_s: 0.5
    publish_degraded_hold_setpoint: true
    degraded_hold_speed_mps: 0.0

  quality:
    enable_magnetic_quality: true
    enable_burial_inversion: true
    enable_online_prior_alignment: false
    magnetic_noise_floor_nt: 0.05
    burial_coupling_constant_nt_m_per_a_rms: 11.4329
    burial_current_rms_a: 100.0
    burial_altitude_m: 6.0
    burial_snr_gate_db: 6.0
    burial_min_strength_nt: 1.0
    burial_min_samples: 20
    burial_window_samples: 30
    burial_max_lateral_offset_m: 1.0
    confidence_min_ready: 0.65
    route_offset_ready_m: 2.0

  acceptance:
    max_route_offset_m: 2.0
    mean_route_offset_m: 1.0
    min_confidence: 0.65
    max_burial_sigma_m: 0.15
    max_burial_sigma_over_limit_ratio: 0.05
    min_valid_burial_ratio: 0.8
    min_tracking_samples: 300
