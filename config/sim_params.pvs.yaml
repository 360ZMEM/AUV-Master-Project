stage:
  name: auv_project_new_stack_pvs

simulation:
  backend: pvs
  world: Dam
  package_name: Ocean
  agent_name: auv0
  show_viewport: false
  verbose: false
  ticks_per_sec: 30
  frames_per_sec: false
  dt: 0.0333333333
  max_steps: 6000

agent:
  type: TorpedoAUV
  control_scheme: 0
  location: [0.0, 0.0, -12.0]
  rotation: [0.0, 0.0, 0.0]
  sensors:
    - sensor_type: PoseSensor
    - sensor_type: DepthSensor
    - sensor_type: IMUSensor
    - sensor_type: DVLSensor

limits:
  fin_deg_max: 30.0
  thrust_min: -100.0
  thrust_max: 100.0
  env_min: [-200.0, -45.0, -35.0]
  env_max: [200.0, 45.0, -4.0]
  safety_margin_xy: 3.0
  safety_margin_z: 1.5

control:
  target_u: 1.1
  u0: 1.0
  u_min: 0.6
  feedforward_trim_deg: -1.5
  depth:
    kp: 0.30
    ki: 0.01
    kd: 0.0
    integral_limit: 4.0
    target_pitch_deg_max: 15.0
    target_pitch_rate_limit_deg_s: 8.0
  pitch:
    kp: 6.5
    ki: 0.15
    kd: 2.2
    integral_limit: 45.0
  yaw:
    kp: 9.0
    ki: 0.12
    kd: 1.4
    integral_limit: 45.0
  speed:
    kp: 28.0
    ki: 1.4
    kd: 3.0
    integral_limit: 55.0
    feedforward:
      a: 2.497183
      b: 27.729751
      c: 0.546851

pvs:
  control_mode: depthHeadingAutopilot
  initial_depth_m: 12.0
  initial_heading_deg: 0.0
  initial_speed_mps: 0.5
  initial_rpm: 0.0
  reference_rpm: 520.0
  reference_speed_rpm_slope: 581.0
  reference_speed_rpm_offset: -115.0
  reference_rpm_min: 300.0
  command_thrust_rpm_scale: 15.0
  max_command_rpm: 1525.0
  current_speed_mps: 0.5
  current_direction_deg: 0.0

digital_twin:
  terrain_slope_deg: 0.0

guidance:
  lookahead_distance: 3.5
  nearest_search_window: 400
  cross_track_gain: 0.7

trajectory:
  kind: cable_like_3d
  duration: 54.5
  dt: 0.1
  start: [0.0, 0.0, -12.0]
  surge_speed: 1.1
  length: 60.0
  lateral_amplitude: 1.2
  lateral_wavenumber: 0.14
  depth_base: -12.0
  depth_amplitude: 0.35
  depth_wavenumber: 0.09
  min_turn_radius: 6.0

debug:
  print_every_n_steps: 15
  event_print: true

evaluation:
  rms_threshold_m: 2.5
  axis_ratio_threshold: 0.02
  sat_ratio_warn_threshold: 0.3

plot:
  save_main_plot: stage2_main_plot.png
  save_sysid_plot: stage2_sysid_plot.png
  dpi: 140
  interactive: false
  3d: true
  interactive_dpi: 80
