name: mag_extrinsics_calibration
description: Dedicated simulated maneuver for magnetometer lever-arm calibration.

sensor_extrinsics_truth:
  mag:
    translation_b_m: [0.30, 0.00, -0.05]
    rotation_rpy_deg: [0.0, 0.0, 2.0]

sensor_extrinsics_estimated:
  mag:
    translation_b_m: [0.20, 0.03, -0.02]
    rotation_rpy_deg: [0.0, 0.0, 0.5]

calibration:
  duration_s: 120.0
  dt_s: 0.1
  seed: 7
  motion: straight_turn_sway
  translation_noise_std_m: 0.01
  rotation_noise_std_deg: 0.05
