name: dvl_dropout_60
description: 60% DVL packet drop with longer freeze windows. Severe degradation.
duration_s: 120
sim_backend: pvs
mpc_mode: ua
chaos:
  enabled: true
  packet_loss_prob: 0.0
  dvl_freeze:
    enabled: true
    drop_rate: 0.60
    freeze_window_s: [1.0, 4.0]
  imu_drift:
    enabled: false
    bias_rate: 0.0
  depth_spike:
    enabled: false
    rate_hz: 0.0
    amplitude_m: 0.0
  mag_saturation_threshold_t: null
perception:
  imu_acc_noise_scale: 1.0
  sonar_noise_scale: 1.0
  cable_current_amp: 500.0
flow:
  current_speed_mps: 0.0
